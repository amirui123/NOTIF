name: Windows experimental build
on:
  push:
    paths:
      - 'IslandX-Windows/**'
      - 'IslandX-Prototype/index.html'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows preview
        run: dotnet build IslandX-Windows/IslandX.Windows.csproj --configuration Release
      - name: Publish standalone preview
        run: dotnet publish IslandX-Windows/IslandX.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output out/IslandX-Windows
      - name: Smoke-test startup on Windows
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'out/IslandX-Windows/IslandX.Windows.exe'
          $process = Start-Process -FilePath $app -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "IslandX exited during startup with code $($process.ExitCode)" }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Test embedded prototype in WebView2
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'out/IslandX-Windows/IslandX.Windows.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw 'WebView2 smoke test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Prototype smoke test failed with code $($process.ExitCode)" }
      - name: Upload experimental build (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IslandX-Windows-experimental-win-x64
          path: out/IslandX-Windows/
          if-no-files-found: error
          retention-days: 7
      - name: Publish clearly labelled preview release
        if: startsWith(github.event.head_commit.message, 'Publish preview')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item IslandX-Windows/README.md out/IslandX-Windows/README.md
          Compress-Archive -Path out/IslandX-Windows/* -DestinationPath out/IslandX-preview-win-x64.zip
          $notes = @'
          **Experimental preview — not a finished Windows island or installer.**

          The first window runs the original IslandX HTML prototype offline, including its existing appearance, animations and trained models. The prototype's notifications, music, battery and other system controls are simulated, not connected to Windows. A separate experimental native status panel can read the clock, battery and clipboard on demand and offers opt-in sign-in startup.

          **Requirements:** Windows x64 and Microsoft Edge WebView2 Runtime. The .NET runtime is bundled. This unsigned portable build may trigger SmartScreen. No installation or uninstaller is included.

          Download the ZIP, extract all files to a permanent folder and run IslandX.Windows.exe. Use the tray icon to reopen the preview or exit. Startup is off unless explicitly enabled in the separate native panel; disable it there before moving or deleting the files.

          Windows notification integration, a desktop overlay, persistent clipboard history, media integration, installer, signing, and full interactive/security/real-device testing are not complete. Do not use sensitive clipboard data in this preview. UI and behaviour may change substantially.
          '@
          $notes | Set-Content -Encoding utf8 out/release-notes.txt
          gh release create v0.1.0-preview out/IslandX-preview-win-x64.zip --target $env:GITHUB_SHA --title "IslandX 0.1.0 — experimental preview" --notes-file out/release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish preview release' }
