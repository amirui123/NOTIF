name: Windows experimental build
on:
  push:
    paths:
      - 'IslandX-Windows/**'
      - 'IslandX-Prototype/index.html'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows preview
        run: dotnet build IslandX-Windows/IslandX.Windows.csproj --configuration Release
      - name: Publish standalone preview
        run: dotnet publish IslandX-Windows/IslandX.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output out/IslandX-Windows
      - name: Smoke-test startup on Windows
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'out/IslandX-Windows/IslandX.Windows.exe'
          $process = Start-Process -FilePath $app -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $detail = Join-Path $env:TEMP 'IslandX-startup-error.txt'
              if (Test-Path $detail) { $text = (Get-Content $detail -Raw) -replace "`r|`n", ' '; Write-Output "::error title=Startup details::$text" }
              Write-Output "::error title=Startup exit::Exit code $($process.ExitCode)"
              throw "IslandX exited during startup with code $($process.ExitCode)"
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Test embedded prototype in WebView2
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'out/IslandX-Windows/IslandX.Windows.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw 'WebView2 smoke test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Prototype smoke test failed with code $($process.ExitCode)" }
      - name: Test native overlay startup and embedded DOM
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'out/IslandX-Windows/IslandX.Windows.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--overlay-smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw 'Overlay test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Overlay test failed with code $($process.ExitCode)" }
      - name: Upload experimental build (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IslandX-Windows-experimental-win-x64
          path: out/IslandX-Windows/
          if-no-files-found: error
          retention-days: 7
      - name: Publish clearly labelled preview release
        if: startsWith(github.event.head_commit.message, 'Publish preview')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item IslandX-Windows/README.md out/IslandX-Windows/README.md
          Copy-Item IslandX-Prototype/index.html out/IslandX-demo.html
          Compress-Archive -Path out/IslandX-Windows/* -DestinationPath out/IslandX-preview-win-x64.zip
          $notes = @'
          **Experimental preview — not a finished product or installer.**

          The app starts an experimental topmost desktop island based on the original prototype. The Windows clock and battery percentage/plugged-in state are connected; charger wattage is not available. The tray menu opens the full demo and an early native panel. Notifications, media, fullscreen detection, and clipboard history are not integrated. The separately downloadable HTML file is the original standalone demo, with simulated system events.

          **Requirements:** Windows 10 version 2004 or newer, x64, and Microsoft Edge WebView2 Runtime. The .NET runtime is bundled. This unsigned portable build may trigger SmartScreen. There is no installer or uninstaller.

          Download the ZIP, extract all files to a permanent folder and run IslandX.Windows.exe. Use the tray icon to reopen the island, open the demo, or exit. Startup is off unless explicitly enabled in the separate native panel; disable it there before moving or deleting the files.

          Real-device visual, input, battery, startup, and security testing remain incomplete. Do not rely on this preview for important notifications or sensitive clipboard data. UI and behaviour may change substantially.
          '@
          $notes | Set-Content -Encoding utf8 out/release-notes.txt
          gh release create v0.2.0-preview out/IslandX-preview-win-x64.zip out/IslandX-demo.html --target $env:GITHUB_SHA --title "IslandX 0.2.0 — experimental desktop island" --notes-file out/release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish preview release' }
