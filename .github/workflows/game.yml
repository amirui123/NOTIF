name: Build game

on:
  push:
    paths: ["rust/**", ".github/workflows/game.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        shell: pwsh
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Verify the binary exists
        shell: pwsh
        run: |
          if (-not (Test-Path rust/target/release/sector7.exe)) {
            Get-ChildItem -Recurse rust/target/release/*.exe
            throw "sector7.exe was not produced"
          }
          Get-Item rust/target/release/sector7.exe | Select-Object Name, Length

      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "rust/target/release/sector7.exe"
          gh release view game-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload game-latest $exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create game-latest $exe --repo $env:GITHUB_REPOSITORY `
              --title "SECTOR-7 (Windows x64)" `
              --notes "Download sector7.exe and run it. Built automatically from the latest commit." `
              --prerelease
          }

      - uses: actions/upload-artifact@v4
        with:
          name: sector7-windows
          path: rust/target/release/sector7.exe
